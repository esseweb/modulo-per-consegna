<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo di Consegna - Come Oro Food</title>
  
  <!-- Importazione Font Bellerose -->
  <link href="https://fonts.cdnfonts.com/css/bellerose" rel="stylesheet">

  <style>
    /* Palette Colori Come Oro Food */
    :root {
      --bg-color: #121212;        
      --card-bg: #1c1c1c;         
      --gold-primary: #d4af37;    
      --gold-hover: #f1c40f;      
      --text-color: #ffffff;      
      --input-bg: #272727;        
      --border-color: #d4af37;    
    }

    /* Stile con Font Bellerose Grassetto e Dimensioni Maggiorate */
    body {
      font-family: 'Bellerose', sans-serif;
      font-weight: bold;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 550px;
      margin: 20px auto;
      padding: 15px;
      letter-spacing: 1.2px;
    }

    .form-container {
      background-color: var(--card-bg);
      padding: 35px 25px;
      border-radius: 12px;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
      text-align: center;
    }

    /* Logo in Alto */
    .logo-header {
      width: 130px;
      height: 130px;
      margin: 0 auto 15px auto;
      display: block;
      border-radius: 50%;
    }

    h2 {
      color: var(--gold-primary);
      text-transform: uppercase;
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--gold-primary);
      padding-bottom: 12px;
      letter-spacing: 2px;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    /* Griglia per affiancare i tre nuovi campi (Scala, Interno, Piano) */
    .form-row-3 {
      display: flex;
      gap: 12px;
    }

    .form-row-3 .form-group {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: bold;
      color: var(--gold-primary);
    }

    input, select {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      background-color: var(--input-bg);
      border: 1.5px solid #444444;
      border-radius: 6px;
      color: var(--text-color);
      font-family: 'Bellerose', sans-serif;
      font-weight: bold;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }

    button {
      background-color: var(--gold-primary);
      color: #000000;
      font-weight: bold;
      padding: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 24px;
      font-family: 'Bellerose', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: background-color 0.3s ease, transform 0.1s ease;
      margin-top: 15px;
    }

    button:hover {
      background-color: var(--gold-hover);
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
    }

    button:active {
      transform: scale(0.98);
    }

    select option {
      background-color: var(--input-bg);
      color: var(--text-color);
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #333333;
      font-size: 16px;
      color: #aaaaaa;
      text-align: center;
      line-height: 1.5;
    }

    footer strong {
      color: var(--gold-primary);
      font-size: 18px;
    }

    /* Adattamento per schermi piccoli (smartphone) */
    @media (max-width: 480px) {
      .form-row-3 {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <!-- Logo -->
    <img src="logo-01.png" alt="Come Oro Food Logo" class="logo-header">

    <h2>Dati per la Consegna</h2>
    
    <!-- Modulo collegato a Formspree -->
    <form action="https://formspree.io/f/xvkpeyjz" method="POST">
      
      <div class="form-group">
        <label for="indirizzo">Indirizzo di Consegna:</label>
        <input type="text" id="indirizzo" name="Indirizzo" placeholder="Via / Piazza e Numero Civico" required>
      </div>

      <!-- Nuova riga con Scala, Interno e Piano -->
      <div class="form-row-3">
        <div class="form-group">
          <label for="scala">Scala:</label>
          <input type="text" id="scala" name="Scala" placeholder="Es. A">
        </div>
        
        <div class="form-group">
          <label for="piano">Piano:</label>
          <input type="text" id="piano" name="Piano" placeholder="Es. 3°">
        </div>

        <div class="form-group">
          <label for="interno">Interno:</label>
          <input type="text" id="interno" name="Interno" placeholder="Es. 12">
        </div>
      </div>

      <div class="form-group">
        <label for="citofono">Cognome Citofono:</label>
        <input type="text" id="citofono" name="Cognome Citofono" placeholder="Nome sul citofono" required>
      </div>

      <div class="form-group">
        <label for="specifiche">Specifiche Abitazione:</label>
        <select id="specifiche" name="Tipo Abitazione" required>
          <option value="">-- Seleziona un'opzione --</option>
          <option value="Palazzina / Appartamento">Palazzina / Appartamento</option>
          <option value="Villa / Casa Indipendente">Villa / Casa Indipendente</option>
          <option value="Ufficio / Azienda">Ufficio / Azienda</option>
          <option value="Altro">Altro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="telefono">Telefono:</label>
        <input type="tel" id="telefono" name="Telefono" placeholder="Numero cellulare" required>
      </div>

      <button type="submit">Invia Dati</button>
    </form>

    <!-- Indirizzo in calce -->
    <footer>
      <strong>Come Oro Food</strong><br>
      Largo B. Jacovitti, 9/10 - 00127 Roma (Mezzocammino)
    </footer>

  </div>

</body>
</html>
